name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Format check
        run: cd mobile && flutter format --set-exit-if-changed .

      - name: Analyze
        run: cd mobile && flutter analyze

      - name: Run tests
        run: cd mobile && flutter test --no-pub --coverage