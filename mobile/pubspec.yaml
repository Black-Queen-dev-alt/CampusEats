name: campus_eats_mobile

description: CampusEats mobile Flutter frontend

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get_it: ^7.6.0
  dio: ^5.4.2
  flutter_secure_storage: ^9.0.0
  go_router: ^14.2.0
  flutter_bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
